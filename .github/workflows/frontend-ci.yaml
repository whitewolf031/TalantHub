name: talanthub_frontend_ci

on:
  workflow_run:
    workflows:
      - talanthub_ci
    types:
      - completed
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/admin-panel

jobs:
  test:
    name: Frontend Test & build
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
        
      - name: Install dependencies
        working-directory: admin-panel
        run: npm ci
      
      - name: Frontend check
        working-directory: admin-panel
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_VITE_API_URL }}
        run: |
          npm run build

      - name: Set up docker
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Prepare docker image
        id: image
        shell: bash
        run: |
          set -e

          BRANCH="${GITHUB_REF_NAME}"
          SHA="${GITHUB_SHA}"
          SHORT_SHA="${SHA:0:7}"

          IMAGE_NAME="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"

          IMAGE="${REGISTRY}/${IMAGE_NAME}:${BRANCH}-${SHORT_SHA}"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "Talanthub Frontend CI"
          echo "======================================"
          echo "Branch     : $BRANCH"
          echo "Commit     : $SHA"
          echo "Short SHA  : $SHORT_SHA"
          echo "Environment: production"
          echo "Image      : $IMAGE"
          echo "======================================"

      - name: Build docker image
        working-directory: admin-panel
        run: |
          docker build \
            -f Dockerfile \
            -t "${{ steps.image.outputs.image }}" \
            .

      - name: Push docker image
        run: |
          docker push "${{ steps.image.outputs.image }}"

      - name: CI message
        run: |
          echo "### 🐳 Talanthub Frontend CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ steps.image.outputs.branch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ steps.image.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** production" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** ${{ steps.image.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Docker image successfully pushed to GHCR." >> "$GITHUB_STEP_SUMMARY"