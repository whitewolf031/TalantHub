name: talanthub_backend_ci

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  test:
    name: Backend Test & build
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
          cache: pip
        
      - name: Install dependencies
        run: | 
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django check
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ${{ secrets.PRODUCTION_DJANGO_SECRET_KEY }}
          DEBUG: ${{ secrets.PRODUCTION_DEBUG }}
          ALLOWED_HOSTS: ${{ secrets.PRODUCTION_ALLOWED_HOSTS }}
          TIME_ZONE: ${{ secrets.PRODUCTION_TIME_ZONE }}
        run: |
          python manage.py check

      - name: Run tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ${{ secrets.PRODUCTION_DJANGO_SECRET_KEY }}
          DEBUG: ${{ secrets.PRODUCTION_DEBUG }}
          ALLOWED_HOSTS: ${{ secrets.PRODUCTION_ALLOWED_HOSTS }}
          TIME_ZONE: ${{ secrets.PRODUCTION_TIME_ZONE }}
        run: |
          python manage.py test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Prepare docker image
        id: image
        shell: bash
        run: |
          set -e

          BRANCH="${GITHUB_REF_NAME}"
          SHA="${GITHUB_SHA}"
          SHORT_SHA="${SHA:0:7}"

          IMAGE_NAME="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"

          IMAGE="${REGISTRY}/${IMAGE_NAME}:${BRANCH}-${SHORT_SHA}"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "Talanthub Backend CI"
          echo "======================================"
          echo "Branch     : $BRANCH"
          echo "Commit     : $SHA"
          echo "Short SHA  : $SHORT_SHA"
          echo "Environment: production"
          echo "Image      : $IMAGE"
          echo "======================================"
      
      - name: Build docker image
        working-directory: backend
        run: |
          docker build \
            -f Dockerfile \
            -t "${{ steps.image.outputs.image }}" \
            .

      - name: Push docker image to GHCR
        run: |
          docker push "${{ steps.image.outputs.image }}"

      - name: CI message
        run: |
          echo "### 🐳 Talanthub Backend CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ steps.image.outputs.branch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ steps.image.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** production" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** ${{ steps.image.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Docker image successfully pushed to GHCR." >> "$GITHUB_STEP_SUMMARY"
