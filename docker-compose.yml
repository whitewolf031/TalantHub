services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # tashqi port 5433: kompyuterdagi lokal PostgreSQL (5432) bilan to'qnashmaydi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web-admin:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      - web-admin

  admin-panel:
    build: ./admin-panel
    restart: unless-stopped
    environment:
      BACKEND_URL: http://web-admin:8000
    depends_on:
      - web-admin
    ports:
      - "3000:80"

volumes:
  postgres_data:
